services:
  - type: web
    name: hoc-y-pubmed-mcp
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: NCBI_CONTACT_EMAIL
        sync: false
      - key: OPENAI_APPS_CHALLENGE_TOKEN
        sync: false
